# The package as its users get it: installed with Composer on every supported version of PHP, once with the oldest
# dependencies it allows. Every example runs without an error and without a message of PHP, and every PDF the examples
# write is a PDF.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: a new release of a dependency shows here without a change of the package.
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  examples:
    name: Examples (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v5

      # The extensions the package requires, and iconv for the CSS parser of dompdf. The php.ini for development shows every
      # message of PHP: the one for production hides deprecations.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-file: development
          extensions: dom, libxml, mbstring, zlib, iconv
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install the package
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run every example
        run: |
          failed=0
          for example in examples/*.php; do
            [ "$(basename "$example")" = "bootstrap.php" ] && continue
            echo "::group::$example"
            output=$(php "$example" 2>&1) || { failed=1; echo "::error::$example ended with an error"; }
            echo "$output"
            if grep -Eq '\b(Warning|Notice|Deprecated|Fatal error)\b' <<< "$output"; then
              failed=1
              echo "::error::$example printed a message of PHP"
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Check the PDFs the examples wrote
        run: |
          php -r '
            $files = glob("examples/output/*.pdf");
            foreach ($files as $file) {
                if (file_get_contents($file, false, null, 0, 5) !== "%PDF-") {
                    echo "no PDF: $file\n";
                    exit(1);
                }
            }
            exit($files === [] ? 1 : 0);
          '
